<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Calculator Engine</title>
    <link rel="stylesheet" href="./style.css">
    <script src="./script.js" defer></script>
</head>

<body>

    <main class="calculator-card">
        <!-- CORREÇÃO MASTER INLINE: Ícone injetado diretamente no esqueleto HTML -->
        <div class="calculator-header">
            <svg xmlns="http://w3.org" viewBox="0 0 24 24" class="brand-logo">
                <rect x="4" y="3" width="16" height="18" rx="3" fill="none" stroke="#AEC346" stroke-width="2" />
                <line x1="7" y1="7" x2="17" y2="7" stroke="#64748B" stroke-width="2" stroke-linecap="round" />
                <circle cx="8" cy="12" r="1" fill="#64748B" />
                <circle cx="12" cy="12" r="1" fill="#64748B" />
                <circle cx="16" cy="12" r="1" fill="#AEC346" />
                <circle cx="8" cy="16" r="1" fill="#64748B" />
                <circle cx="12" cy="16" r="1" fill="#64748B" />
                <circle cx="16" cy="16" r="1" fill="#AEC346" />
            </svg>
            <span class="brand-text">Master Calc Engine</span>
        </div>

        <!-- Tela de exibição protegida -->
        <div class="display-container">
            <div id="history-display" class="display-history"></div>
            <div id="main-display" class="display-main">0</div>
        </div>

        <!-- Grade de botões gerenciados -->
        <div class="buttons-grid">
            <!-- Linha Avançada (Math Object) -->
            <button class="btn-advanced" data-op="clear">C</button>
            <button class="btn-advanced" data-op="pow">x²</button>
            <button class="btn-advanced" data-op="sqrt">√</button>
            <button class="btn-operator" data-op="div">÷</button>

            <!-- Linha 7-9 -->
            <button class="btn-num">7</button>
            <button class="btn-num">8</button>
            <button class="btn-num">9</button>
            <button class="btn-operator" data-op="mul">×</button>

            <!-- Linha 4-6 -->
            <button class="btn-num">4</button>
            <button class="btn-num">5</button>
            <button class="btn-num">6</button>
            <button class="btn-operator" data-op="sub">-</button>

            <!-- Linha 1-3 -->
            <button class="btn-num">1</button>
            <button class="btn-num">2</button>
            <button class="btn-num">3</button>
            <button class="btn-operator" data-op="sum">+</button>

            <!-- Linha Base -->
            <button class="btn-num btn-zero">0</button>
            <button class="btn-num">.</button>
            <button id="equal-button" class="btn-equal">=</button>
        </div>
    </main>

</body>

</html>
