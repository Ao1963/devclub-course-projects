<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jokempô - Modern Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://googleapis.com" rel="stylesheet">
</head>

<body>

    <main class="game-container">
        <header class="game-header">
            <h1 class="game-header__title">Rock<br>Paper<br>Scissors</h1>
            <div class="score-board">
                <div class="score-board__item">
                    <span class="score-board__label">Player</span>
                    <span class="score-board__value" id="player-score">0</span>
                </div>
                <div class="score-board__item">
                    <span class="score-board__label">CPU</span>
                    <span class="score-board__value" id="computer-score">0</span>
                </div>
            </div>
        </header>

        <section class="game-arena">
            <div class="game-arena__side">
                <span class="game-arena__label">Your Pick</span>
                <div class="game-arena__token is-empty" id="player-token"></div>
            </div>
            <div class="game-arena__result is-hidden" id="result-display">
                <h2 class="game-arena__status" id="result-text">YOU WIN</h2>
                <button class="btn btn--secondary" id="btn-next">Next Round</button>
            </div>
            <div class="game-arena__side">
                <span class="game-arena__label">CPU Pick</span>
                <div class="game-arena__token is-empty" id="computer-token"></div>
            </div>
        </section>

        <section class="game-controls" id="controls-section">
            <button class="token-btn token-btn--rock" data-choice="rock" aria-label="Select Rock">✊</button>
            <button class="token-btn token-btn--paper" data-choice="paper" aria-label="Select Paper">✋</button>
            <button class="token-btn token-btn--scissors" data-choice="scissors"
                aria-label="Select Scissors">✌️</button>
        </section>

        <footer class="game-footer">
            <button class="btn btn--outline" id="btn-reset">Reset Game</button>
        </footer>
    </main>

    <script src="script.js"></script>
</body>

</html>
