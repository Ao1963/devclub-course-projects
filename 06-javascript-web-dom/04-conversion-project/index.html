<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevClub - Convert Money</title>
    
    <!-- Link de conexão com o arquivo de estilos que você vai criar -->
    <link rel="stylesheet" href="./style.css">
    
    <!-- Conexão do script com a tag defer (padrão de performance) -->
    <script src="./script.js" defer></script>
</head>
<body>

    <main>
        <img src="./assets/logo.gif" alt="logo-devclub-convert-money">
        
        <label>
            Converter <b>de</b>
            <select>
                <option>R$ Real Brasileiro</option>
            </select>
        </label>

        <label>
            Converter <b>para</b>
            <select>
                <option>US$ Dólar americano</option>
                <option>€ Euro</option>
            </select>
        </label>

        <label>
            Valor
            <input placeholder="R$ 10.000,00">
        </label>

        <button>Converter</button>

        <section>
            <div>
                <img src="./assets/real.png" alt="logo-moeda-a-converter">
                <p>Real</p>
                <p>R$ 0,00</p>
            </div>

            <img src="./assets/arrow.png" alt="seta">

            <div>
                <img src="./assets/dolar.png" alt="logo-moeda-a-convertida">
                <p>Dolar</p>
                <p>US$ 0,00</p>
            </div>
        </section>
    </main>

</body>
</html>
