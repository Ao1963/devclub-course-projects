<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevClub - Convert Money Master</title>
    <link rel="stylesheet" href="./style.css">
    <script src="./script.js" defer></script>
</head>
<body>

    <main>
        <img class="logo" src="./assets/logo.gif" alt="logo-devclub-convert-money">
        
        <label>
            Converter <b>de</b>
            <select id="select-from" name="currency-from">
                <option value="BRL">R$ Real Brasileiro</option>
                <option value="USD">US$ Dólar americano</option>
                <option value="EUR">€ Euro</option>
                <option value="CHF">Franco Suíço</option>
                <option value="GBP">Libra Esterlina</option>
            </select>
        </label>

        <label>
            Converter <b>para</b>
            <select id="select-to" name="currency-to">
                <option value="USD">US$ Dólar americano</option>
                <option value="EUR">€ Euro</option>
                <option value="CHF">Franco Suíço</option>
                <option value="GBP">Libra Esterlina</option>
                <option value="BRL">R$ Real Brasileiro</option>
            </select>
        </label>

        <label>
            Valor
            <!-- Placeholder simplificado e minimalista: Menos é mais -->
            <input id="user-input" name="amount" placeholder="Enter amount...">
        </label>

        <button>Converter</button>

        <section>
            <!-- Moeda de Origem (Esquerda) -->
            <div class="currency-box">
                <img class="currency-img-from" src="./assets/brazil-flag.png" alt="logo-moeda-a-converter">
                <p class="currency">Real</p>
                <p class="currency-value-to-convert">R$ 0,00</p>
            </div>

            <img class="arrow-img" src="./assets/vector.png" alt="seta">

            <!-- Moeda de Destino (Direita) -->
            <div class="currency-box">
                <img class="currency-img-to" src="./assets/united-states-flag.png" alt="logo-moeda-a-convertida">
                <p class="currency">Dolar</p>
                <p class="currency-value">US$ 0,00</p>
            </div>
        </section>
    </main>

</body>
</html>
