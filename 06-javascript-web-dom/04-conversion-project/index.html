<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevClub - Convert Money</title>

    <!-- Link de conexão com o arquivo de estilos (style.css) -->
    <link rel="stylesheet" href="./style.css">

    <!-- Conexão do script com a tag defer (padrão de performance) -->
    <script src="./script.js" defer></script>
</head>

<body>

    <main>
        <!-- Adicionada a classe logo para centralizar com o margin: auto -->
        <img class="logo" src="./assets/logo.gif" alt="logo-devclub-convert-money">

        <label>
            Converter <b>de</b>
            <select id="select-from" name="currency-from">
                <option>R$ Real Brasileiro</option>
            </select>
        </label>

        <label>
            Converter <b>para</b>
            <select id="select-to" name="currency-to">
                <option>US$ Dólar americano</option>
                <option>€ Euro</option>
            </select>
        </label>

        <label>
            Valor
            <!-- Adicionado o atributo name="amount" para zerar o aviso do Chrome -->
            <input id="user-input" name="amount" placeholder="R$ 10.000,00">
        </label>

        <button>Converter</button>

        <section>
            <!-- Adicionada a classe currency-box para alinhar os textos em coluna -->
            <div class="currency-box">
                <!-- Nome corrigido da bandeira do Brasil -->
                <img src="./assets/brazil-flag.png" alt="logo-moeda-a-converter">
                <p class="currency">Real</p>
                <p class="currency-value">R$ 0,00</p>
            </div>

            <!-- Nome corrigido do vetor/seta -->
            <img class="arrow-img" src="./assets/vector.png" alt="seta">

            <!-- Bloco da Moeda Convertida (Destino) -->
            <div class="currency-box">
                <!-- Adicionada a classe currency-img aqui para o JavaScript poder alterá-la -->
                <img class="currency-img" src="./assets/united-states-flag.png" alt="logo-moeda-a-convertida">
                <p class="currency">Dolar</p>
                <p class="currency-value">US$ 0,00</p>
            </div>
        </section>
    </main>

</body>

</html>
